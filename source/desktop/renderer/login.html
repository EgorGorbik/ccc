<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Falcon Assistant</title>
<style>
  :root{color-scheme:dark;--bg:#101313;--fg:#eeefea;--muted:#9da8a2;--card:#171b1a;--border:#2b322f;--primary:#d5be8e;--primary-fg:#1e1d17;--input:#141917;}
  *{box-sizing:border-box;}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--fg);}
  .wrap{padding:30px 28px;display:flex;flex-direction:column;min-height:100vh;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.04em;margin-bottom:6px;}
  .mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(160deg,#ead7a6,#8d7848);color:#1e1d17;display:grid;place-items:center;font-size:13px;font-weight:700;}
  small.sub{color:var(--muted);display:block;margin-bottom:22px;}
  h1{font-size:1.25rem;font-weight:550;margin:0 0 4px;}
  p.lead{color:var(--muted);margin:0 0 20px;font-size:.9rem;}
  label{display:block;font-size:.8rem;color:#c3ccc6;margin:0 0 6px;}
  input{width:100%;min-height:42px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--fg);padding:8px 12px;font-size:1rem;margin-bottom:16px;}
  input:focus{outline:2px solid var(--primary);outline-offset:2px;}
  button{width:100%;min-height:46px;background:var(--primary);color:var(--primary-fg);border:0;border-radius:8px;font-weight:600;font-size:.95rem;cursor:pointer;}
  button:disabled{opacity:.6;cursor:default;}
  .err{background:#3a2420;border:1px solid #ef9b97;color:#ffd9d4;border-radius:8px;padding:10px 12px;font-size:.85rem;margin-bottom:16px;display:none;}
  .err.show{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="mark">✦</span><span>FALCON ASSISTANT</span></div>
  <small class="sub">AI</small>
  <h1>Продолжить</h1>
  <p class="lead">Войдите, чтобы открыть ассистента на этом компьютере.</p>
  <div class="err" id="err" role="alert"></div>
  <form id="form">
    <label for="id">Логин</label>
    <input id="id" name="id" type="text" autocomplete="username" required/>
    <label for="code">Код доступа</label>
    <input id="code" name="code" type="password" autocomplete="current-password" required/>
    <button id="submit" type="submit">Войти</button>
  </form>
</div>
<script src="./login.js"></script>
</body>
</html>
