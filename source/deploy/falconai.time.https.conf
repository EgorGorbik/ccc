limit_req_zone $binary_remote_addr zone=falcon_time_requests:10m rate=20r/s;
server {
    listen 80;
    server_name falconai.time;
    location ^~ /.well-known/acme-challenge/ { root /var/www/falcon-time-acme; }
    location / { return 301 https://falconai.time$request_uri; }
}
server {
    listen 443 ssl;
    server_name falconai.time;
    ssl_certificate /etc/letsencrypt/live/falconai.time/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/falconai.time/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100k;
    client_body_timeout 15s;
    limit_req zone=falcon_time_requests burst=50 nodelay;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:3187;
        proxy_http_version 1.1;
        proxy_set_header Host falconai.time;
        proxy_set_header X-Forwarded-Host falconai.time;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
