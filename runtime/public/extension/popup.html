<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>body{width:330px;padding:20px;margin:0;background:#171b22;color:#f0f1f3;font:14px/1.5 system-ui}h1{font-size:20px;margin:0 0 18px;color:#e4bd71}p{color:#acb6c4;font-size:12px}button,input,select{font:inherit;box-sizing:border-box;width:100%;padding:11px;margin-top:10px;background:#252c36;border:1px solid #49505b;border-radius:8px;color:#fff}button{cursor:pointer}button.primary{background:#e4bd71;color:#221d13;border:0}label{display:block;font-size:12px;margin-top:14px}#error{color:#ffc4bf;white-space:pre-wrap}strong{font-size:17px}small{display:block;color:#aebacb}.row{display:flex;gap:8px}</style></head><body><h1>FALCON TIME</h1><div id="loading">Подключаемся…</div><div id="main" hidden><strong id="name"></strong><small id="status"></small><div id="unbound"><label>Название устройства<input id="device" value="Мой компьютер"></label><button class="primary" id="connect">Подключить мой профиль</button></div><div id="bound" hidden><label>Проект текущего чата<select id="project"><option value="none">Без проекта</option></select></label><small id="context"></small><div class="row"><button id="resume">Возобновить</button><button id="stop">Завершить</button></div><button id="sync">Синхронизировать</button><p id="last"></p><button id="quarantine" hidden>Скачать отложенные события</button><button id="reconnect">Переподключить мой профиль</button></div><button id="open">Открыть кабинет</button><p id="error" role="alert"></p><p>Убедитесь, что в ChatGPT открыт целевой аккаунт. Кабинет оставьте открытым в другой вкладке. Переписка не записывается.</p></div><script src="popup.js"></script></body></html>
